<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0D0D0D"/>

  <!-- Left candle (bearish, red) -->
  <line x1="7" y1="7" x2="7" y2="10" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="4" y="10" width="6" height="9" rx="1" fill="#ef4444"/>
  <line x1="7" y1="19" x2="7" y2="22" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Middle candle (bullish, gold — tallest) -->
  <line x1="16" y1="4" x2="16" y2="7" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="13" y="7" width="6" height="14" rx="1" fill="#F5A623"/>
  <line x1="16" y1="21" x2="16" y2="25" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right candle (bullish, gold) -->
  <line x1="25" y1="8" x2="25" y2="11" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="22" y="11" width="6" height="10" rx="1" fill="#F5A623"/>
  <line x1="25" y1="21" x2="25" y2="24" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
</svg>
